name: Release General

on:
  push:
    tags:
      - '[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tarball:
    name: Release tarball
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Installing dependencies ...
        run: |
          # Fail fast when the apt mirror stalls
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n' \
              | sudo tee /etc/apt/apt.conf.d/99-timeout >/dev/null
          sudo apt-get -y update
          sudo apt-get -y install build-essential autoconf automake bison \
                                  pkg-config systemd-dev
      - name: Creating Makefiles ...
        run: |
          ./autogen.sh
          ./configure
      - name: Build release ...
        run: |
          make distcheck
          mkdir -p artifacts/
          mv mrouted-*.tar.* artifacts/
          ls -lF artifacts/
      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: release-tarball
          path: artifacts/*
          if-no-files-found: error
          retention-days: 1

  debian:
    name: Debian package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Installing dependencies ...
        run: |
          # Fail fast when the apt mirror stalls
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n' \
              | sudo tee /etc/apt/apt.conf.d/99-timeout >/dev/null
          sudo apt-get -y update
          sudo apt-get -y install build-essential autoconf automake bison \
                                  pkg-config systemd-dev debhelper dpkg-dev \
                                  devscripts fakeroot lintian
      - name: Build Debian package ...
        run: |
          # A native package version cannot carry a hyphen
          ver=$(echo "${GITHUB_REF_NAME}" | tr '-' '~')
          deb=$(dpkg-parsechangelog -S Version)
          if [ "$deb" != "$ver" ]; then
              echo "debian/changelog is at $deb, tag says $ver"
              exit 1
          fi
          ./autogen.sh
          ./configure
          # The tarball job runs the suite via distcheck.
          DEB_BUILD_OPTIONS=nocheck make package
      - name: Collect packages ...
        run: |
          mkdir -p artifacts/
          mv ../mrouted_*.deb ../mrinfo_*.deb ../mtrace_*.deb \
             ../map-mbone_*.deb artifacts/
          # .ddeb on Ubuntu, .deb on Debian
          for deb in ../*-dbgsym_*.ddeb ../*-dbgsym_*.deb; do
              [ -e "$deb" ] && mv "$deb" artifacts/
          done
          mv ../mrouted_*.changes artifacts/
          ls -lF artifacts/
      - name: Inspect packages ...
        run: |
          for deb in artifacts/*.deb; do
              echo "=== $deb ==="
              dpkg -I "$deb"
              dpkg -c "$deb"
          done
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: release-debian
          path: artifacts/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ tarball, debian ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Setting release variables ...
        id: build
        run: |
          ver=${GITHUB_REF#refs/tags/}
          if echo "$ver" | grep -qE '(-alpha|-beta|-rc)[0-9]*$'; then
            echo "pre=true"     >> $GITHUB_OUTPUT
            echo "latest=false" >> $GITHUB_OUTPUT
          else
            echo "pre=false"    >> $GITHUB_OUTPUT
            echo "latest=true"  >> $GITHUB_OUTPUT
          fi
      - name: Download artifacts ...
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Extract ChangeLog entry ...
        run: |
          awk '/-----*/{if (x == 1) exit; x=1;next}x' ChangeLog.md \
              |head -n -1 > release.md
          cat release.md
      - uses: ncipollo/release-action@v1
        with:
          name: mrouted v${{ github.ref_name }}
          prerelease: ${{ steps.build.outputs.pre }}
          makeLatest: ${{ steps.build.outputs.latest }}
          bodyFile: "release.md"
          artifacts: "artifacts/*"
